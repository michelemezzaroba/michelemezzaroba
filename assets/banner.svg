<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Michele Mezzaroba — QA Engineer SR</title>
  <desc id="d">Qualidade que se prova em pipeline. Automação de testes web, API, mobile e performance. Terminal animado rodando npm test: e2e com Playwright e Cypress, API com Mocha, Chai e Supertest, mobile com Appium e BrowserStack, performance com k6 e JMeter, CI com GitHub Actions e IA com Claude, Codex e Gemini. 6 passing, 0 failing.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#111B34"/>
    </linearGradient>
    <radialGradient id="brilhoOuro" cx="940" cy="170" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5B841" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F5B841" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoTeal" cx="80" cy="330" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="destaque" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B841"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="janela"><rect x="1" y="1" width="1198" height="318" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    /* só deslocamento: em renderização estática (t=0) o texto continua legível */
    .ln { animation: entra .5s ease-out backwards; }
    .l1 { animation-delay: .3s; } .l2 { animation-delay: .9s; } .l3 { animation-delay: 1.25s; }
    .l4 { animation-delay: 1.6s; } .l5 { animation-delay: 1.95s; } .l6 { animation-delay: 2.3s; }
    .l7 { animation-delay: 2.65s; } .l8 { animation-delay: 3.1s; }
    .cursor { animation: pisca 1.1s steps(1) 3.4s infinite; }
    .led { animation: pulsa 2.4s ease-in-out infinite; }
    @keyframes entra { from { transform: translateX(-10px); } }
    @keyframes pisca { 50% { opacity: 0; } }
    @keyframes pulsa { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .ln, .cursor, .led { animation: none; } }
  </style>

  <!-- fundo -->
  <g clip-path="url(#janela)">
    <rect width="1200" height="320" fill="url(#fundo)"/>
    <rect width="1200" height="320" fill="url(#grade)"/>
    <rect width="1200" height="320" fill="url(#brilhoOuro)"/>
    <rect width="1200" height="320" fill="url(#brilhoTeal)"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#22304F" stroke-width="2"/>

  <!-- identidade (deslocada 12px para centralizar sem a linha de localização) -->
  <g class="sans" transform="translate(0 12)">
    <rect x="64" y="46" width="348" height="30" rx="15" fill="#F5B841" fill-opacity=".10" stroke="#F5B841" stroke-opacity=".45"/>
    <circle class="led" cx="83" cy="61" r="4" fill="#F5B841"/>
    <text x="97" y="66" font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#F5B841">QUALIDADE · AUTOMAÇÃO · PIPELINE</text>

    <text x="62" y="134" font-size="58" font-weight="700" fill="#F3F6FC" letter-spacing="-1">Michele Mezzaroba</text>
    <text x="64" y="172" font-size="20"><tspan font-weight="700" fill="#F5B841">QA Engineer SR</tspan><tspan fill="#A9B4C8"> · testes web, API, mobile e performance</tspan></text>

    <text x="64" y="204" font-size="18" font-style="italic" fill="#F3F6FC" fill-opacity=".85">Qualidade que se prova em pipeline.</text>

    <rect x="64" y="224" width="360" height="4" rx="2" fill="url(#destaque)"/>

    <text x="64" y="258" font-size="12.5" font-weight="700" letter-spacing="2" fill="#2DD4BF">PLAYWRIGHT · CYPRESS · APPIUM · K6 · JMETER</text>
  </g>

  <!-- terminal animado (marca da v2: substitui o monograma) -->
  <rect x="716" y="36" width="444" height="256" rx="14" fill="#121C33" fill-opacity=".9" stroke="#22304F"/>
  <path d="M716 66 H1160" stroke="#22304F"/>
  <circle cx="738" cy="51" r="5" fill="#FB7185"/>
  <circle cx="756" cy="51" r="5" fill="#F5B841"/>
  <circle cx="774" cy="51" r="5" fill="#2DD4BF"/>
  <text x="938" y="56" text-anchor="middle" class="mono" font-size="12.5" fill="#7C89A3">michelemezzaroba — qa-pipeline</text>

  <g class="mono" font-size="15" fill="#F3F6FC">
    <text x="740" y="96"  class="ln l1"><tspan fill="#F5B841">$</tspan> npm test</text>
    <text x="740" y="124" class="ln l2"><tspan fill="#2DD4BF">✓</tspan><tspan x="764" fill="#2DD4BF">e2e</tspan><tspan x="846">playwright · cypress</tspan></text>
    <text x="740" y="149" class="ln l3"><tspan fill="#2DD4BF">✓</tspan><tspan x="764" fill="#F5B841">api</tspan><tspan x="846">mocha · chai · supertest</tspan></text>
    <text x="740" y="174" class="ln l4"><tspan fill="#2DD4BF">✓</tspan><tspan x="764" fill="#7DD3FC">mobile</tspan><tspan x="846">appium · browserstack</tspan></text>
    <text x="740" y="199" class="ln l5"><tspan fill="#2DD4BF">✓</tspan><tspan x="764" fill="#FB7185">perf</tspan><tspan x="846">k6 · jmeter</tspan></text>
    <text x="740" y="224" class="ln l6"><tspan fill="#2DD4BF">✓</tspan><tspan x="764" fill="#A9B4C8">ci</tspan><tspan x="846">github actions</tspan></text>
    <text x="740" y="249" class="ln l7"><tspan fill="#2DD4BF">✓</tspan><tspan x="764" fill="#A78BFA">ia</tspan><tspan x="846">claude · codex · gemini</tspan></text>
    <text x="740" y="278" class="ln l8"><tspan fill="#2DD4BF" font-weight="700">6 passing</tspan><tspan x="846" fill="#7C89A3">0 failing</tspan></text>
  </g>
  <rect class="cursor" x="932" y="265" width="9" height="17" rx="1" fill="#2DD4BF"/>
</svg>
