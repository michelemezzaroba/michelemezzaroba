<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Michele Mezzaroba — Analista de Testes Sênior</title>
  <desc id="d">Janela de terminal com a suíte de testes passando: E2E com Cypress e Cucumber, API com Mocha, Chai e Supertest, mobile com Robot Framework e Appium, performance com k6 e CI com GitHub Actions.</desc>
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .ln { animation: entra .45s ease-out backwards; }
    .l1 { animation-delay: .3s; } .l2 { animation-delay: .9s; } .l3 { animation-delay: 1.3s; }
    .l4 { animation-delay: 1.7s; } .l5 { animation-delay: 2.1s; } .l6 { animation-delay: 2.5s; }
    .l7 { animation-delay: 3.0s; }
    .cursor { animation: pisca 1.1s steps(1) 3.2s infinite; }
    /* só deslocamento: em renderização estática (t=0) o texto continua legível */
    @keyframes entra { from { transform: translateX(-10px); } }
    @keyframes pisca { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ln, .cursor { animation: none; } }
  </style>

  <!-- janela -->
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="#13111C" stroke="#2E2A40" stroke-width="2"/>
  <path d="M1 44 H1199" stroke="#2E2A40" stroke-width="2"/>
  <circle cx="30" cy="23" r="6.5" fill="#FF6B81"/>
  <circle cx="52" cy="23" r="6.5" fill="#FFB547"/>
  <circle cx="74" cy="23" r="6.5" fill="#3DDC97"/>
  <text x="600" y="28" text-anchor="middle" class="mono" font-size="14" fill="#9C96B5">michelemezzaroba — qa-pipeline</text>

  <!-- identidade -->
  <text x="56" y="112" class="mono" font-size="16" fill="#9D8CFF">// analista de testes sênior · RS, Brasil</text>
  <text x="54" y="172" class="sans" font-size="54" font-weight="700" fill="#ECE9F5" letter-spacing="-1">Michele Mezzaroba</text>
  <text x="56" y="212" class="sans" font-size="22" fill="#9C96B5">Qualidade que se prova em pipeline.</text>

  <!-- camadas de teste (uma cor por camada) -->
  <g class="mono" font-size="15" text-anchor="middle">
    <rect x="56"  y="244" width="96"  height="32" rx="16" fill="#3DDC97" fill-opacity=".12" stroke="#3DDC97" stroke-opacity=".55"/>
    <text x="104" y="265" fill="#3DDC97">E2E web</text>
    <rect x="162" y="244" width="60"  height="32" rx="16" fill="#9D8CFF" fill-opacity=".12" stroke="#9D8CFF" stroke-opacity=".55"/>
    <text x="192" y="265" fill="#9D8CFF">API</text>
    <rect x="232" y="244" width="86"  height="32" rx="16" fill="#5CC8FF" fill-opacity=".12" stroke="#5CC8FF" stroke-opacity=".55"/>
    <text x="275" y="265" fill="#5CC8FF">Mobile</text>
    <rect x="328" y="244" width="132" height="32" rx="16" fill="#FFB547" fill-opacity=".12" stroke="#FFB547" stroke-opacity=".55"/>
    <text x="394" y="265" fill="#FFB547">Performance</text>
    <rect x="470" y="244" width="78"  height="32" rx="16" fill="#ECE9F5" fill-opacity=".08" stroke="#ECE9F5" stroke-opacity=".4"/>
    <text x="509" y="265" fill="#ECE9F5">CI/CD</text>
  </g>

  <!-- terminal -->
  <rect x="700" y="72" width="452" height="236" rx="12" fill="#1C1928" stroke="#2E2A40"/>
  <g class="mono" font-size="15" fill="#ECE9F5">
    <text x="726" y="110" class="ln l1"><tspan fill="#9D8CFF">$</tspan> npm test</text>
    <text x="726" y="142" class="ln l2"><tspan fill="#3DDC97">✓</tspan><tspan x="750" fill="#9C96B5">e2e</tspan><tspan x="832">cypress + cucumber</tspan></text>
    <text x="726" y="170" class="ln l3"><tspan fill="#3DDC97">✓</tspan><tspan x="750" fill="#9C96B5">api</tspan><tspan x="832">mocha · chai · supertest</tspan></text>
    <text x="726" y="198" class="ln l4"><tspan fill="#3DDC97">✓</tspan><tspan x="750" fill="#9C96B5">mobile</tspan><tspan x="832">robot framework + appium</tspan></text>
    <text x="726" y="226" class="ln l5"><tspan fill="#3DDC97">✓</tspan><tspan x="750" fill="#9C96B5">perf</tspan><tspan x="832">k6 · stages · thresholds</tspan></text>
    <text x="726" y="254" class="ln l6"><tspan fill="#3DDC97">✓</tspan><tspan x="750" fill="#9C96B5">ci</tspan><tspan x="832">github actions</tspan></text>
    <text x="726" y="288" class="ln l7"><tspan fill="#3DDC97" font-weight="700">5 passing</tspan><tspan x="832" fill="#9C96B5">0 failing</tspan></text>
  </g>
  <rect class="cursor" x="918" y="274" width="9" height="18" fill="#3DDC97"/>
</svg>
